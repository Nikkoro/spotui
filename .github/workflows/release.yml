name: release

on:
  push:
    # A v* tag, or a release/v* branch (the version is the part after
    # "release/"; the tag is created by the release itself).
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/heads/release/') && format('{0}', github.ref_name) || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libasound2-dev ninja-build pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/vcpkg
            vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Static codecs (vcpkg)
        # libFLAC and libmpg123 go inside the binary, so it runs whatever
        # versions the system has (Ubuntu 26.04 ships a newer libFLAC).
        run: |
          if [ ! -x /tmp/vcpkg/vcpkg ]; then
            git clone --depth 1 --branch 2025.09.17 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          /tmp/vcpkg/vcpkg install --triplet x64-linux
        env:
          VCPKG_ROOT: /tmp/vcpkg
      - name: Build
        env:
          PKG_CONFIG: pkg-config --static
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION#release/}" -o spotui ./cmd/spotui
      - name: Check the binary needs no codec libraries
        run: |
          ldd spotui
          if ldd spotui | grep -E 'libFLAC|libmpg123|libogg|libvorbis'; then exit 1; fi
      - run: tar czf spotui-linux-amd64.tar.gz spotui README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: spotui-linux-amd64.tar.gz

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 pkg-config curl zip unzip tar
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/vcpkg
            vcpkg_installed
          key: vcpkg-mingw-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}
      - name: Bootstrap vcpkg
        run: |
          if [ ! -x /tmp/vcpkg/vcpkg ]; then
            git clone --depth 1 --branch 2025.09.17 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
      - run: /tmp/vcpkg/vcpkg install --triplet x64-mingw-static
        env:
          VCPKG_ROOT: /tmp/vcpkg
      - name: Cross-compile
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CGO_LDFLAGS: -static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/vcpkg_installed/x64-mingw-static/lib/pkgconfig
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-mingw-static/lib/pkgconfig
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION#release/}" -o spotui.exe ./cmd/spotui
      - run: zip spotui-windows-amd64.zip spotui.exe README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: spotui-windows-amd64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum spotui-linux-amd64.tar.gz spotui-windows-amd64.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub (which creates the tag) gets
          # the binaries attached; otherwise one is created.
          TAG="${VERSION#release/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              spotui-linux-amd64.tar.gz spotui-windows-amd64.zip SHA256SUMS
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "spotui $TAG" \
              --generate-notes \
              spotui-linux-amd64.tar.gz spotui-windows-amd64.zip SHA256SUMS
          fi

  packages:
    # Point the package managers at the new release. Scoop's manifest lives
    # in this repo (bucket/); Homebrew and the AUR are updated only when
    # their secrets are set (see docs/DEVELOPMENT.md, "Packages").
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${VERSION#release/}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir /tmp/rel
          packaging/render.sh "${TAG#v}" /tmp/rel/SHA256SUMS /tmp/pkg
      - name: Scoop (bucket/ in this repo)
        run: |
          cp /tmp/pkg/scoop/spotui.json bucket/spotui.json
          if git diff --quiet; then echo "Scoop manifest unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Scoop: spotui ${VERSION#release/}"
          git push origin HEAD:main
      - name: Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN: skipped"; exit 0; fi
          git clone "https://x-access-token:${TOKEN}@github.com/Nikkoro/homebrew-spotui.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/pkg/homebrew/spotui.rb /tmp/tap/Formula/spotui.rb
          cd /tmp/tap
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo "Formula unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spotui.rb
          git commit -m "spotui ${VERSION#release/}"
          git push
      - name: AUR (spotui-bin)
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No AUR_SSH_KEY: skipped"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/spotui-bin.git /tmp/aur
          cp /tmp/pkg/aur/PKGBUILD /tmp/pkg/aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          if [ -z "$(git status --porcelain)" ]; then echo "PKGBUILD unchanged"; exit 0; fi
          git config user.name "Nikodem Domaracki"
          git config user.email "nikodemdomaracki@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "spotui ${VERSION#release/}"
          git push origin HEAD:master
