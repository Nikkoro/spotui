name: release

on:
  push:
    # A v* tag, or a release/v* branch (the version is the part after
    # "release/"; the tag is created by the release itself).
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/heads/release/') && format('{0}', github.ref_name) || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libasound2-dev libvorbis-dev libogg-dev libflac-dev libmpg123-dev
      - run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION#release/}" -o spotui ./cmd/spotui
      - run: tar czf spotui-linux-amd64.tar.gz spotui README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: spotui-linux-amd64.tar.gz

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 pkg-config curl zip unzip tar
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/vcpkg
            vcpkg_installed
          key: vcpkg-mingw-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}
      - name: Bootstrap vcpkg
        run: |
          if [ ! -x /tmp/vcpkg/vcpkg ]; then
            git clone --depth 1 --branch 2025.09.17 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
      - run: /tmp/vcpkg/vcpkg install --triplet x64-mingw-static
        env:
          VCPKG_ROOT: /tmp/vcpkg
      - name: Cross-compile
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CGO_LDFLAGS: -static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/vcpkg_installed/x64-mingw-static/lib/pkgconfig
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-mingw-static/lib/pkgconfig
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION#release/}" -o spotui.exe ./cmd/spotui
      - run: zip spotui-windows-amd64.zip spotui.exe README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: spotui-windows-amd64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub (which creates the tag) gets
          # the binaries attached; otherwise one is created.
          TAG="${VERSION#release/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              spotui-linux-amd64.tar.gz spotui-windows-amd64.zip
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "spotui $TAG" \
              --generate-notes \
              spotui-linux-amd64.tar.gz spotui-windows-amd64.zip
          fi
